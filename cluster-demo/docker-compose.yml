services:
  qdrant-node1:
    image: qdrant/qdrant:v1.12.0
    container_name: qdrant-node1
    ports:
      - "6333:6333"
      - "6334:6334"
      - "6335:6335"
    volumes:
      - ./storage-node1:/qdrant/storage
    environment:
      - QDRANT__CLUSTER__ENABLED=true
      - QDRANT__CLUSTER__P2P__PORT=6335
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HOST=0.0.0.0
      - QDRANT__CLUSTER__P2P__ENABLE_CONSENSUS=true
    command: "./entrypoint.sh --uri http://qdrant-node1:6335"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    restart: unless-stopped

  qdrant-node2:
    image: qdrant/qdrant:v1.12.0
    container_name: qdrant-node2
    ports:
      - "6343:6333"
      - "6344:6334"
      - "6345:6335"
    volumes:
      - ./storage-node2:/qdrant/storage
    environment:
      - QDRANT__CLUSTER__ENABLED=true
      - QDRANT__CLUSTER__P2P__PORT=6335
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HOST=0.0.0.0
      - QDRANT__CLUSTER__P2P__ENABLE_CONSENSUS=true
    command: "./entrypoint.sh --bootstrap http://qdrant-node1:6335 --uri http://qdrant-node2:6335"
    depends_on:
      - qdrant-node1
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    restart: unless-stopped

  qdrant-node3:
