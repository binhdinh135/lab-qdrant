      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HOST=0.0.0.0
      - QDRANT__CLUSTER__P2P__ENABLE_CONSENSUS=true
    command: "./entrypoint.sh --bootstrap http://qdrant-node1:6335 --uri http://qdrant-node3:6335"
