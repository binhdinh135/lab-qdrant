services:
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: qdrant-demo
    ports:
      - "6333:6333"   # REST API + Dashboard
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G       # Giới hạn 2GB RAM - máy 16GB không lo lag
          cpus: "2.0"      # Giới hạn 2 cores - còn 6 threads cho Windows
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
