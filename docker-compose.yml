services:
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe-rbac
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: Oracle123
      APP_USER: RBAC_ADMIN
      APP_USER_PASSWORD: Oracle123
    volumes:
      - oracle_data:/opt/oracle/oradata
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: qdrant-rbac
    ports:
      - "6390:6333"
      - "6391:6334"
    environment:
      QDRANT__SERVICE__API_KEY: "admin-secret-key-demo"
      QDRANT__SERVICE__READ_ONLY_API_KEY: "readonly-key-demo"
      QDRANT__SERVICE__JWT_RBAC: "true"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  oracle_data:
